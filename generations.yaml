generations:
  - name: "First Generation (Pre-facelift)"
    start_year: 2020
    end_year: 2023
    description: "The first generation BYD Sealion 6 (marketed as BYD Song Plus in China) was introduced in September 2020 as a larger and more upmarket alternative to the BYD Song Pro, positioned in the compact SUV segment. Available in plug-in hybrid DM-i and battery electric EV variants. The pre-facelift model features the original front end and rear end design with a 12.8-inch rotatable central infotainment screen with the third-generation DiLink system. DM-i variants include 51 km and 110 km electric range options with an 8.3 kWh or 18.3 kWh LFP Blade battery. The EV variant is equipped with a 71.7 kWh LFP Blade battery providing a CLTC range of up to 520 km."
  - name: "First Generation (2023 Facelift)"
    start_year: 2023
    end_year: null
    description: "The 2023 facelift was launched in June 2023 for the Chinese market as the Song Plus Champion Edition, featuring a restyled front end and rear end design with headlamp units similar to the BYD Seal. The BYD logo replaced the Song emblem, aligning it with Ocean series vehicles. Exported to Europe as the BYD Seal U (September 2023) and to other markets as the BYD Sealion 6 (from May 2024 onwards). Available in DM-i plug-in hybrid and EV variants. DM-i versions include 75 km, 112 km, and 160 km electric range options with various battery sizes (12.9-26.6 kWh). EV variants offer 520 km and 605 km CLTC range options. In 2024 and 2025, extended range battery options were introduced for both DM-i and EV variants, expanding the available electric range configurations."
